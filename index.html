<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nepali Lyrics - Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Navbar -->
    <header class="navbar">
      <nav class="nav-links">
        <a href="index.html" class="active">Home</a>
        <span class="divider"></span>
        <a href="#">Songs</a>
        <span class="divider"></span>
        <a href="#">Contact</a>
      </nav>

      <div class="search-box">
        <!-- Compact SVG icon positioned inside the input wrapper -->
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search songs..." />
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <h1>Welcome to Nepali Lyrics</h1>
      <p>Select a song from the navbar or check back soon for new additions!</p>
    </main>
  </body>
</html>
